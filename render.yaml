services:
  - type: web
    name: computer-vision-streamlit
    env: python
    runtime: python-3.12.2
    buildCommand: "pip install -r requirements.txt"
    startCommand: "streamlit run app.py --server.port $PORT --server.address 0.0.0.0"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: UPLOAD_FOLDER
        value: "images"
      - key: SECRET_KEY
        generateValue: true